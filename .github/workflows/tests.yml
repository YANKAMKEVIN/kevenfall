name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      captures:
        description: "Rejouer aussi la partie avec rendu et captures d'écran (~30 min, 4 lots)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_SILENCE_ROOT_WARNING: 1

jobs:
  verifs:
    # Bloquant : taille des fichiers, import sans erreur ni avertissement, chargement de tous
    # les scripts (avertissements GDScript bloquants : project.godot, [debug]), tests unitaires.
    name: Vérifications et tests unitaires
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installer Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          echo "7de56444b130b10af84d19c7e0cf63cf9e9937ee4ba94364c3b7dd114253ca21  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Taille, import, scripts et tests unitaires
        run: tools/check.sh
      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-verifs
          path: ci-out/
          retention-days: 7

  parcours:
    # Bloquant : le robot joue les 11 chapitres sans rendu (~20 s par partie) et atteint
    # chacune des trois fins ; chaque sauvegarde automatique doit se relire.
    name: Parcours (${{ matrix.fin.nom }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fin:
          - { nom: "L'Accord", args: "--fin=accord" }
          - { nom: "Le Long Sommeil", args: "--fin=sommeil" }
          - { nom: "Le Réveil, Éveiller à la Tortue", args: "--eveiller --fin=reveil" }
    steps:
      - uses: actions/checkout@v4
      - name: Installer Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          echo "7de56444b130b10af84d19c7e0cf63cf9e9937ee4ba94364c3b7dd114253ca21  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Importer le projet
        run: |
          "$GODOT" --headless --path . --import > /dev/null 2>&1 || true
          "$GODOT" --headless --path . --import > /dev/null 2>&1 || true
      - name: Le robot joue les 11 chapitres
        run: tools/parcours.sh ${{ matrix.fin.args }}
      - name: Journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parcours-${{ strategy.job-index }}
          path: ci-out/
          retention-days: 7

  captures:
    # À la demande seulement : la même partie avec rendu (écran virtuel) et captures d'écran,
    # pour relire le visuel. Lente sans GPU, d'où les quatre lots.
    if: github.event_name == 'workflow_dispatch' && inputs.captures
    name: Captures (${{ matrix.lot.nom }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lot:
          - { nom: "actes I et II, chap. 1 à 5", args: "--stop-after=act2" }
          - { nom: "acte II, chap. 6 et 7", args: "--fin2 --stop-after=fin2" }
          - { nom: "acte III, chap. 8 à 10", args: "--act3 --stop-after=act3a" }
          - { nom: "chap. 11 et fin", args: "--final" }
    steps:
      - uses: actions/checkout@v4
      - name: Installer Godot 4.3 et un écran virtuel
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          echo "7de56444b130b10af84d19c7e0cf63cf9e9937ee4ba94364c3b7dd114253ca21  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Le robot joue le lot
        run: tools/ci.sh ${{ matrix.lot.args }}
      - name: Captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-${{ strategy.job-index }}
          path: ci-out/
          retention-days: 7
